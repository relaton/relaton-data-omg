  content: This specification defines specific interfaces for Party Management that each of the other (future) finance related components will request information from. The goal of this specification and the Party Management Facility (PMF) in general is to define these interfaces at a level where, for example, an insurance company can easily replace their current OMG-compliant PMF component with a new one in a seamless manner.
