  content: Extends SysML with additional information needed to model physical interaction and signal flow simulation independently of simulation platforms.  Provides a human-usable textual syntax for mathematical expressions.  Includes a platform-independent SysML library of simulation elements that can be reused in system models.  Gives translations between SysML as extended above and two widely-used simulation languages and tools for physical interaction and signal flow simulation.
