  script: Latn
  content: This is a revised and upgraded version of the Enhanced View of Time (EVoT) v1.2 specification. This version fixes some issues of the previous specification and introduces new features. The changes introduced were motivated by the experience matured in several projects that relied on the EVoT v1.2 for delivering high performance and highly available time services in application domains such as Air Traffic Control (ATC) Systems and Command/Control Systems. As its predecessors, this specification leaves the specification of Time Service unchanged.
