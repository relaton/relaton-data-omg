abstract:
- language: en
  script: Latn
  content: The Foundational UML Subset (fUML) is an executable subset of standard UML that can be used to define, in an operational style, the structural and behavioral semantics of systems.  It may also be used to define MOF-based modeling languages such as standard UML or its subsets and extensions. For example, the semantics of UML state machines can be specified as a program written in fUML.
