abstract:
- language: en
  script: Latn
  content: |-
    Over time, a number of different modeling techniques and concepts have emerged within the real-time software community. Each technique has fostered its own diverse set of terminology and notations. One of the intentions behind this specification is to provide a common framework within UML that fully encompasses this diversity but still leaves enough flexibility for different specializations. In particular, focus was placed on
    properties that are related to modeling of time and time-related aspects such as the key characteristics of timeliness, performance, and schedulability
