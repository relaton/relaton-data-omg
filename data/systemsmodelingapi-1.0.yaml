  content: The Systems Modeling API and Services includes the following. (1) Platform-Independent Model (PIM)provides a service specificationindependent of anyplatform or technology. This specification defines each of the services and their operations with inputs and outputs. The PIM serves as the logical API model. (2) Platform-Specific Models (PSMs)are bindings of the PIM using a particular technology, such as REST/HTTP, SOAP, Java, and .NET. Multiple platform-specific models can exist for a given PIM.
