- language: en
  script: Latn
  content: |-
    The Lightweight Load Balancing Service provides a framework for, per-request, static load balancing. The standard allows the definition of user defined load balancing strategies, while requiring complying
    implementations to provide at least the round robin and random strategies. This service provides a façade for managing load balancing strategies, along with the creation of load balancing groups.
