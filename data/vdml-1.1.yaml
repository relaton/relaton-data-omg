- language: en
  script: Latn
  content: The purpose of VDML is to provide a standard modeling language for analysis and design of the operation of an enterprise with particular focus on the creation and exchange of value. It provides an abstraction of the operation of an enterprise that is appropriate for business executives, along with representation of supporting detail for business analysts to link strategy and business models to the activities, roles, and capabilities that run the enterprise.
