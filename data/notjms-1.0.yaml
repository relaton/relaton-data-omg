  content: The Java Message Service (JMS) defines a standard API that provides a simplified and common way for Java clients to access message oriented middleware. More importantly, JMS is tightly integrated into J2EE and is the messaging standard for Enterprise Java Beans (EJB). Applications publishing a message are de-coupled from applications receiving them by means of a Queue or topic concept.
