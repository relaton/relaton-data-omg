abstract:
- language: en
  script: Latn
  content: This specification defines a meta-model for representing existing software, its elements, associations, and operational environments, referred to as the Knowledge Discovery Meta-model (KDM). This is the first in the series of specifications related to Software Assurance (SwA) and Architecture-Driven Modernization (ADM) activities. KDM facilitates projects that involve existing software systems by insuring interoperability and exchange of data between tools provided by different vendors.
