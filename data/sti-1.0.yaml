  content: Space Telecommunications Interface (STI) is a standard to meet space communications and navigation system needs by by defining an open architecture for space and ground software-defined radios (SDRs) where specialized hardware is common, operators are often absent, and size, weight, and power (SWaP) are major hardware considerations.
