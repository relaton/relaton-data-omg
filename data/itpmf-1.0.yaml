  content: The fundamental approach taken has been to supply only a core model that can be linked to any external model (or not at all). A Linkage package is specified for supporting this linking. In the future a user of a MOF 2.0 version of Interface Portfolio Management Facility (ITPMF) could use Model merging to incorporate the ITPMF classes directly into their metamodels.
