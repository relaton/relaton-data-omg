abstract:
- language: en
  script: Latn
  content: "OMG modeling communities include people that may communicate in different natural or specialized languages. Often the patterns represented in models are reusable, either directly or with minor differences across organizations with a business, discipline, or domain area. For effective interaction and user understanding, models must be expressed in natural languages and sometimes nomenclatures or in terms of other business vocabulary appropriate for the intended users. To facilitate deeper understanding of the models by both domain experts and systems, software and data engineers, there is a need to enable expression of the definitions associated with the model elements in alternative forms as well. \r\n\r\nThe Multiple Vocabulary Facility (MVF) enables modeling tool vendors and users to express any model element in a given model in terms of multiple natural languages and terminologies. While many tools provide at least some form of internationalization, MVF fills a more general requirement to enable the association of alternative vocabularies with model elements so that the model elements themselves can be created, displayed, and referenced using the terms and definitions of a selected vocabulary. The creation of concept definitions and associated term sets may be performed by individual developers or by communities for domains of interest. Therefore the Multiple Vocabulary Facility (MVF) supports use of alternative vocabularies by modeling language tools in addition to enabling creation and maintenance of concepts and associated vocabularies, providing a standard form for the sharing, import and export, of alternative vocabularies containing concept definitions and associated terms."
