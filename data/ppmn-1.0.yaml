  content: A Pedigree and Provenance Model and Notation (PPMN) model is a repository of elements capturing the lineage, custody and/or ownership of entities of interest. PPMN models may include elements representing the history of the entities of interest as well as specifications of expected events and processes (herein eferred to generally as 'occurrences') related to types of entities of interest.
