abstract:
- language: en
  script: Latn
  content: The labor-intensive process of integrating different equipment into an automated system is a primary problem in laboratory automation today. Hardware and software standards are needed to facilitate equipment integration and thereby significantly reduce the cost and effort to develop fully automated laboratories. The integration of different laboratory devices into a working automation environment has long been a difficult task. In a fully automated laboratory, integration issues become even more demanding. Too many proprietary device interfaces, protocols, and concepts are involved, and, worse yet, the vendors in this market have not been able to agree upon a common control standard. Such a standard would enable a user to configure his/her lab as a heterogeneous environment that is simpler to configure, easier to extend, and much less expensive to maintain.  LECIS (Laboratory Equipment Control Interface Specification, ASTM (American Society for Testing and Materials) Standard E1989-98) is an initial approach to solve these problems. LECIS defines a discrete state and communication model for laboratory devices.
