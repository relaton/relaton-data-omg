abstract:
- language: en
  script: Latn
  content: Within the wide domain of C4I systems, we distinguish the domain of naval Combat Management Systems. C4I systems are located on a naval ship, that assist the command team in its responsibility for execution of a mission. The Naval CMS systems' main capabilities encompass awareness of situation around the ship (or a group of ships within a naval force or theater) using sensors, exchange and fusion of this information into a tactical picture to support recognition of threats and response to those threats using actuators such as torpedo, missile, and gun systems.
