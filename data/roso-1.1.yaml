  content: "The Robotic Service Ontology (RoSO) defines vocabularies to describe functions and constraints of robotic functional\r\ncomponents for deployment in robotic services. RoSO is intended to work with IEEE1872-2015 [IEEE1872] for robotic\r\nfunctions. RoSO also intended to work with other ontologies for Human-Robot or Human-Agent Interaction (HRI/HAI)\r\nand ontologies for the service domain."
