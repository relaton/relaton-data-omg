abstract:
- language: en
  script: Latn
  content: 'This specification proposes that XML Metadata Interchange (XMI) is used to interchange data warehouse metadata based on the CWM metamodel. The CWM metamodel is specified using the Meta Object Facility (MOF) Model, allowing XMI to be used to: transform the CWM metamodel into a CWM Document Type Definition (DTD); transfer instances of warehouse metadata that conform to the CWM metamodel as XML documents, based on the CWM DTD; and transform the CWM metamodel itself into an XML document, based on the MOF DTD, for interchange between MOF-compliant repositories.'
