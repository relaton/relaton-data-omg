  script: Latn
  content: "The Precise Semantics for Uncertainty Modeling (PSUM) version 1.0 builds the foundation for developing uncertainty modeling solutions, to guide the implementation of uncertainty modeling tools, to provide the basis for developing training materials and resources in the application of uncertainty modeling, and to serve as the cornerstone of proposing future revisions and extensions of uncertainty modeling solutions.\r\n\r\nThe PSUM metamodel is defined using the MOF meta-modeling language, to be consistent with other models defined by OMG."
