abstract:
- language: en
  script: Latn
  content: Many failed enterprise applications wasted millions of dollars before being terminated. While some of these failures can be blamed on technology issues, the causes of many failures are rooted in the state of the organization into which the application is being deployed. Many, perhaps most of these organizational problems manifest themselves as weaknesses in the business processes that are the target of an enterprise application. Improving organizational readiness for technology deployment is the motivation for creating the Business Process Maturity Model (BPMM).
