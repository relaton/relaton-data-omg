abstract:
- language: en
  script: Latn
  content: "The domain of military and operational Command and Control systems is characterized by a huge variety of underlying computing platforms. A standard-based interface to common TACtical SITuation (TACSIT) services is thus essential for interoperable and open systems. In this scope, a first standard has already been issued by the OMG: the TACSIT Controller Interface consists of set of interfaces to interact with TACSIT display systems. \r\nThis specification offers data interfaces to TACSIT systems. More specifically, it standardizes:\r\n- The data that need to be exchanged with TACSIT systems. \r\n- The interfaces needed to exchange data from/to TACSIT systems."
