  script: Latn
  content: The Metamodel Extension Facility (MEF) provides an alternative, and more advanced and flexible way to create Profiles for modeling languages / systems defined as MOF meta model, including UML and its derivates. MEF is designed to be on the surface compatible with the existing Stereotype notation, but translates Stereotype definitions into SMOF-based multiple classifications.
