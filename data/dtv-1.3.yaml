abstract:
- language: en
  script: Latn
  content: |-
    This vocabulary attempts to satisfy several goals that tend to conflict.
    - Provide a Standard Business Vocabulary for Date and Time Concepts: Provide a vocabulary of date and time concepts that business users can share and exploit in their business domain vocabularies and rules; 
    - Support Machine Reasoning about Time: Provide a formal ontology that enables machine interpretation and reasoning. This means that processing by automated reasoners is possible, based on a well-grounded formal representation; and 
    - Enable implementation: Enable tool vendors and other software developers to implement the date and time vocabulary with a 'reasonable' amount of development effort, meaning that the value obtained is commensurate with the development cost.
