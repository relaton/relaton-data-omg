  script: Latn
  content: "This document is a specification document on the standard Digital Receipt API, which has been formulated as a standard specification by the Digital Receipt Subcommittee of the .NET Retail System Council Japan as part of a contract project of the Ministry of Economy, Trade and Industry of Japan.\r\nThis specification can connect POS terminals for various business types of business of various vendors by standardizing APIs related to transmission and reception of digital receipt data between digital receipt server and POS terminal, and between digital receipt server and smartphone. The purpose is to reduce development costs and system integration costs. Another object is to make it easier to use digital receipt data by making it easier to create a smartphone application that uses digital receipt data."
