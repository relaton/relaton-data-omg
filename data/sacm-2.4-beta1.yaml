abstract:
- language: en
  script: Latn
  content: This specification defines a metamodel and UML profile for that metamodel for representing structured assurance cases and a graphical notation for depicting an Assurance Case and allowing System Engineering tools to incorporate Assurance Cases into their environment. An Assurance Case is a set of auditable claims, arguments, and evidence created to support the claim that a defined system/service will satisfy the particular requirements. An Assurance Case facilitates information exchange between various system stakeholders such as suppliers and acquirers, and between the operator and regulator, where the knowledge related to the safety and security of the system is communicated in a clear and defendable way.
