- language: en
  script: Latn
  content: This specification is a metamodel for the EXPRESS information modeling language, as defined by ISO 10303-11.2:2004. The purpose of this specification is to provide a common basis for communication among tools that create or compile EXPRESS models, analyze them, and/or map them to various forms of implementation specifications. It is also intended to serve as a basis for the definition of formal standard mappings to other modeling and implementation languages.
