abstract:
- language: en
  script: Latn
  content: The FACE Profile for UAF provides a mechanism to model the Open Group's Future Airborne Capability Environment (FACE?) Edition 3.0 data architecture and components using UML-based tools. It further enables representation of FACE components in the context of larger Unified Architecture Framework (UAF®) system-of-systems architectures to better identify interactions between FACE components and other components in the architecture. Representation in the larger context enables analysis of the impact of incorporation of FACE components into the architecture, and the UML basis enables use of other profiles, such as the UML Profile for MARTE, to be used in this analysis.
