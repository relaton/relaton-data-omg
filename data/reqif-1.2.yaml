  content: |-
    This document is created to inform:
    - Persons interested in exchanging requirements data between organizations that do not have a possibility to share the same repository.
    - Requirements authoring tool vendors who want to support the Requirements Interchange Format (ReqIF) with export and import interfaces for their requirements authoring tools. 
    - Tool vendors other than requirements authoring tool vendors who wish to interchange requirements for documentation or other purposes.
    - Anyone interested in defining, interchanging, storing, etc., requirements in a standard interchange format.
