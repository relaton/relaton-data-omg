abstract:
- language: en
  script: Latn
  content: This specification provides a lightweight approach to transform MOF-compliant metamodels into OWL Ontologies. The transformation is in principle bi-directional, however limitations imposed by MOF and/or OWL may apply. The primary transformation direction supported by this specification is from MOF to OWL and is made lossless through AnnotationProperties defined in the included MOF Support ontology.
