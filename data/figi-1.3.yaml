abstract:
- language: en
  script: Latn
  content: "The Financial Instrument Global Identifier specification details an open data based approach for identifying financial instruments through use of a permanent, semantically meaningless code key with associated identifying metadata.\r\n\r\nThe Financial Instrument Global Identifier provides a data model approach to identifying financial instruments in various contexts. These contexts relate to different processes across asset classes and operational needs where associated metadata needs may differ for the same financial instrument or collection of financial instruments (such as baskets).\r\n\r\nThrough use of a persistent, semantically meaningless code (e.g. the FIGI), the methodology allows for creation of a self referential data model and creation of object entities that can satisfy different needs requiring different levels of granularity through associated metadata based on contextual usage."
