  content: The Standard Business Reporting Model (SBRM)  provides a  set of modeling constructs for representing business and regulatory reporting that are reusable in different modeling and data deployment environments. It acts as a Platform Independent Model for report documents and data structures, complementing established platform-specific models such as  eXtensible Business Reporting Language (XBRL).
