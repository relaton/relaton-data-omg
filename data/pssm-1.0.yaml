  script: Latn
  content: The Precise Semantics of UML State Machines (PSSM) specification is an extension of the Semantics of a Foundational Subset for Executable UML Models standard (known as 'Foundational UML' or 'fUML') [fUML] that defines the execution semantics for UML state machines. Syntactically, this specification extends fUML with a (large) subset of the abstract syntax of state machines as given in the OMG Unified Modeling Language specification.
