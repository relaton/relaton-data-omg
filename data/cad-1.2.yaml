  content: This specification is an interface standard for Mechanical Computer Aided Design (CAD) systems that enable the interoperability of CAD, Computer Aided Manufacturing (CAM) and Computer Aided Engineering (CAE) tools. The aim is to provide users of design and engineering systems the ability to seamlessly integrate, best-in-class, software across a wide variety of CAD/CAM and CAE applications through CORBA interfaces.
