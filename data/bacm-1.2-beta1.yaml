abstract:
- language: en
  script: Latn
  content: "The specification defines metamodel concepts for modeling businesses and other kinds of organizations intended for strategy formulation and planning, business transformation and business analysis. It is intended for use in conjunction with other OMG business-related specifications such as BMM, VDML, BPMN etc., and with common business methodologies.\r\nIts primary concept is the business capability - an abstraction representing what a business does but not how. It surrounds business capability with concepts of value delivery (value streams), customer behavior, products, organization design and strategy impact. It provides a means to associate information from other models and business documents with concepts in the business architecture model."
