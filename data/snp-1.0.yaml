  content: This specification addresses the need for a standardized data exchange format for Single Nucleotide Polymorphisms (SNPs) entities in the Life Sciences domains. As a result of recent advances in SNPs research, a large amount of experimental data has been accumulating. Standardization is required to facilitate exchanging these data and developing interoperable systems for managing and analyzing them.
