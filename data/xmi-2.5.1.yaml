abstract:
- language: en
  script: Latn
  content: |-
    This specification defines the following aspects involved in describing objects in XML:
    - The representation of objects in terms of XML elements and attributes.
    - The standard mechanisms to link objects within the same file or across files.
    - The validation of XMI documents using XML Schemas.
    - Object identity, which allows objects to be referenced from other objects in terms of IDs and UUIDs. XMI describes solutions to the above issues by specifying EBNF production rules to create XML documents and Schemas that share objects consistently.
