  content: This specification defines three compliance points for SPEM 2.0. Implementations are encouraged to conform to one of these compliance points if their goal is to ensure successful data exchange with other compliance point implementers. In addition to these compliance points, the specification provides the freedom to implementers to choose any combination of meta-model packages and package merges that they wish to implement.
