  script: Latn
  content: This specification defines a mapping between WSDL specifications, with a SOAP Binding, to a corresponding set of OMG IDL interface specifications. This specification is applicable to the domain of WSDL specifications that use only the constructs that result from the CORBA to WSDL-SOAP specification. This simplifies the mapping and allows for mapping from a restricted WSDLSOAP subset to CORBA IDL interfaces.
