- language: en
  script: Latn
  content: This specification primarily defines the interface between the CMS and a Radar system within a modular combat system architecture for naval platforms. However, it is structured to align with the objective of dividing the interface into three categories, namely subsystem services (interfaces applicable to any module within a combat system), sensor services (interfaces applicable to any sensor component within a combat system) and radar services.
