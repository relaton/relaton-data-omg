abstract:
- language: en
  script: Latn
  content: 'The Reusable Asset Specification (RAS) addresses the engineering elements of reuse. It attempts to reduce the friction associated with reuse transactions through consistent, standard packaging. This is much like the steering wheel, turn signals, pedals, and fuel gauge in a car: although they are slightly different across car models and makes, there is a familiarity among them that significantly reduces the costs of reuse.'
