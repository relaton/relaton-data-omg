  script: Latn
  content: In any architecture, there is a tension between a general purpose solution and supporting specialist applications. Real-time developers have to pay strict attention to the allocation of resources and to the predictability of system execution. By providing the developer with handles on managing resources and on predictability, Real-time CORBA sacrifices some of the general purpose nature of CORBA in order support the development of real-time systems
