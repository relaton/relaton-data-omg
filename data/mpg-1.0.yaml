abstract:
- language: en
  script: Latn
  content: The Model for Performance-Driven Government (MPG) specifies a model that provides a uniform basis for agencies within the U.S. Federal Government to represent, analyze, and report on their enterprise-level transformation activities. It specifies how key transformation elements such as segment architecture, performance architecture, and investment planning model content are to be represented. It supports repository maintenance of that content and the fundamental information required to meet transparency and accountability goals.
