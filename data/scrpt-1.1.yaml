  script: Latn
  content: 'The Relationship Service allows entities and relationships to be explicitly represented. Entities are represented as CORBA objects. The service defines two new kinds of objects: relationships and roles. A role represents a CORBA object in an relationship. A relationship is created by passing a set of roles to a relationship factory.'
