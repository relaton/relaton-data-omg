abstract:
- language: en
  script: Latn
  content: The OMG General Ledger Facility defines the interfaces and their semantics that are required to enable interoperability between General Ledger systems and accounting applications, as well as other distributed objects and applications for accounting purposes. The business accounting function (of which, General Ledger is the common core) is a statutory requirement for all commercial organizations and individual proprietorship. The vast majority of General Ledger systems are proprietary, non-standard and noninteroperable, even though the underlying accounting concepts have been stable for over 500 years. Applications such as Payroll systems and Report Writers need to interoperate with General Ledger systems, however; this is currently a tedious, difficult, and error prone task due to the general lack of technology standardization. Additionally, many other accounting applications including Accounts Payable, Accounts Receivable, Inventory, Sales and Purchase Order Processing, and Invoicing also need to interoperate with General Ledger systems. Standard interfaces to General Ledger would allow the user to mix and match different vendors implementations of accounting applications, and enable interoperability with other kinds of applications.
